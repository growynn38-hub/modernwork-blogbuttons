<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: transparent;
    width: 100%;
  }

  .wrapper {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
  }

  /* 배너 영역 */
  .banner {
    position: relative;
    width: 100%;
    aspect-ratio: 800 / 300;
    overflow: hidden;
  }

  .banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 버튼 영역 */
  .buttons {
    background: #faf8f5;
    padding: 10px 12px 12px;
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: nowrap;
  }

  .btn-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    transition: transform 0.18s ease, opacity 0.18s ease;
    cursor: pointer;
    flex: 1;
    max-width: 80px;
  }

  .btn-item:hover {
    transform: translateY(-3px);
    opacity: 0.85;
  }

  .btn-item img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
  }
</style>
</head>
